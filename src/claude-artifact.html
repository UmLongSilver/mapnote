<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>마인드맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ───────── 테마 ───────── */
:root{
  --bg:#f6f5f2; --dot:#dad6ce; --panel:#ffffff; --ink:#1f1e1c; --muted:#7b776f; --line:#e3e0d8;
  --accent:#3b6cf6; --lk:#8a7fb8; --node:#ffffff; --root-bg:#1f1e1c; --root-ink:#ffffff;
  --shadow:0 6px 20px rgba(30,25,15,.08),0 1px 3px rgba(30,25,15,.06);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#151515; --dot:#2a2a2a; --panel:#222222; --ink:#ecebe8; --muted:#9a968e; --line:#343434;
    --node:#232323; --lk:#a59bd6; --root-bg:#ecebe8; --root-ink:#151515; --accent:#6b8dff; --shadow:0 6px 20px rgba(0,0,0,.45); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none}

/* ───────── 캔버스 ───────── */
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}

/* ───────── 노드 ───────── */
.node{position:absolute;padding:6px 12px;border-radius:9px;background:var(--node);border:1.5px solid var(--line);
  font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;width:max-content;max-width:260px;min-width:44px;
  cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:outline-color .1s}
.node.root{background:var(--root-bg);color:var(--root-ink);border-color:var(--root-bg);font-size:19px;font-weight:700;
  padding:12px 24px;border-radius:999px;max-width:320px;text-align:center}
.node.l1{font-weight:600;font-size:16px;padding:8px 15px;border-radius:11px;border-width:2px}
.node.sel{outline:2.5px solid var(--accent);outline-offset:3px}
.node.drop{outline:2.5px dashed var(--accent);outline-offset:4px}
.node.dragsrc{pointer-events:none;box-shadow:var(--shadow);opacity:.92}
/* 포스트잇 */
.sticky{position:absolute;width:170px;min-height:66px;padding:12px 13px 14px;color:#2b2a26;border-radius:3px 3px 3px 16px;
  box-shadow:0 7px 16px rgba(0,0,0,.13),0 1px 2px rgba(0,0,0,.1);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;
  cursor:grab;user-select:none;-webkit-user-select:none;z-index:2;transform:rotate(-1.3deg)}
.sticky.sel{outline:2.5px solid var(--accent);outline-offset:3px}
.sticky.linksrc{outline:2.5px dashed var(--lk);outline-offset:4px}
.sticky.drop{outline:2.5px dashed var(--accent);outline-offset:4px}
.sticky.dragging{pointer-events:none;cursor:grabbing;box-shadow:0 14px 28px rgba(0,0,0,.2);transform:rotate(1deg) scale(1.02)}
.sticky .st{display:block;min-height:1.5em;outline:none}
.sticky .st:empty::before{content:"메모 입력";opacity:.45}
.sticky .st[contenteditable]{cursor:text;user-select:text;-webkit-user-select:text}
.sticky .pin{position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#e03131;
  box-shadow:0 2px 3px rgba(0,0,0,.3),inset -2px -2px 3px rgba(0,0,0,.2)}
.node .t{display:inline-block;min-width:1ch;outline:none}
.node .t:empty::before{content:"주제 입력";opacity:.45}
.node .t[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text}
.badge{position:absolute;top:50%;transform:translateY(-50%);min-width:24px;height:24px;padding:0 7px;border-radius:12px;
  font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.badge.r{right:-34px}.badge.l{left:-34px}
/* 관계선(연관 노드) */
.lhit{pointer-events:stroke;cursor:pointer}
.llabel{position:absolute;transform:translate(-50%,-50%);background:var(--bg);color:var(--muted);border:1.5px dashed var(--lk);
  border-radius:8px;padding:2px 8px;font-size:12px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;user-select:none;-webkit-user-select:none}
.llabel.hl{border-color:var(--accent);color:var(--ink)}
.llabel.sel{border-style:solid;border-color:var(--accent);color:var(--ink)}
.node.linksrc{outline:2.5px dashed var(--lk);outline-offset:4px}
#hint{position:fixed;left:50%;top:66px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:999px;padding:8px 8px 8px 16px;font-size:13px;display:none;align-items:center;gap:10px;z-index:12;white-space:nowrap}
#hint.show{display:flex}
#hint button{border:0;background:rgba(127,127,127,.15);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12px}
#ghost{position:fixed;z-index:50;pointer-events:none;opacity:.85;transform:rotate(-2deg);box-shadow:var(--shadow)}

/* ───────── 공통 패널 ───────── */
.pill{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;padding:3px}
.ib{width:40px;height:40px;border:0;background:none;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:rgba(127,127,127,.13)}
.ib:disabled{opacity:.3;cursor:default;background:none}

/* 상단 바 */
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:10}
#top>*{pointer-events:auto}
#titlebox{flex:1 1 auto;min-width:0;max-width:420px;cursor:pointer;padding:3px 12px 3px 3px}
#titlebox .txt{min-width:0;flex:1;padding-left:4px}
#mapTitle{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap}
#status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:var(--muted);vertical-align:1px}
#status.cloud::before{background:#2f9e44}#status.saving::before{background:#f08c00}#status.error::before{background:#e03131}
.spacer{flex:1}
@media (max-width:480px){#top .ib{width:36px;height:38px}#top{gap:6px;left:8px;right:8px}#btnRedo{display:none}#titlebox{padding-right:8px}}

/* 하단 노드 툴바 */
#bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:2px;z-index:10;max-width:calc(100vw - 16px);overflow-x:auto}
#bar.show{display:flex}
#bar button,#lbar button,#sbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;min-width:54px;height:54px;
  border:0;background:none;border-radius:10px;cursor:pointer;padding:0 4px;white-space:nowrap}
#bar button:hover,#lbar button:hover,#sbar button:hover{background:rgba(127,127,127,.13)}
#bar button:disabled{opacity:.3;cursor:default;background:none}
#bar .danger{color:#e03131}
#colors{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);display:none;gap:6px;padding:8px;z-index:11}
#colors.show{display:flex}
#colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
#colors button.on{border-color:var(--ink)}
#colors .reset{background:conic-gradient(#e8590c,#2f9e44,#1971c2,#ae3ec9,#e8590c)}

/* 메뉴 */
#menu{position:fixed;top:62px;right:10px;display:none;flex-direction:column;align-items:stretch;padding:6px;z-index:20;min-width:220px}
#menu.show{display:flex}
#menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
#menu button:hover{background:rgba(127,127,127,.13)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* 사이드바 (마인드맵 목록) */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#scrim.show{opacity:1;pointer-events:auto}
#side{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);background:var(--panel);z-index:31;transform:translateX(-102%);
  transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#side.open{transform:none}
#side header{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 8px 18px}
#side h2{margin:0;font-size:17px}
#side .actions{display:flex;gap:6px;padding:4px 14px 10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(127,127,127,.1)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.red{background:#e03131;border-color:#e03131;color:#fff}
#list{flex:1;overflow-y:auto;padding:4px 8px 20px}
.item{display:flex;align-items:center;gap:6px;padding:10px 6px 10px 12px;border-radius:10px;cursor:pointer}
.item:hover{background:rgba(127,127,127,.09)}
.item.on{background:rgba(59,108,246,.12)}
.item .meta{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.item .confirm{display:flex;gap:4px}
.item .confirm .btn{padding:6px 9px;font-size:12px}

/* 모달 */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:rgba(0,0,0,.3);padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;padding:18px}
#modal h3{margin:0 0 6px;font-size:17px}
#modal p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5}
#modal textarea{width:100%;flex:1;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.55 ui-monospace,Menlo,monospace;
  background:var(--bg);color:var(--ink);resize:vertical}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#modal .help{overflow-y:auto}
#modal .help table{width:100%;border-collapse:collapse;font-size:14px}
#modal .help td{padding:7px 4px;border-bottom:1px solid var(--line)}
#modal .help td:first-child{white-space:nowrap;color:var(--muted);width:42%}
kbd{font:12px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink)}

/* 표 (단어장 등) */
#nTableWrap{flex:1;display:flex;flex-direction:column;min-height:0}
#notes.istable #nBody{display:none}
#notes:not(.istable) #nTableWrap{display:none}
.tscroll{flex:1;overflow:auto;padding:4px 14px 10px}
#nTable{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
#nTable th,#nTable td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left;padding:0}
#nTable tr>*:first-child{border-left:0}
#nTable thead th{position:sticky;top:0;background:var(--panel);z-index:1;border-top:1px solid var(--line)}
#nTable thead th:nth-child(2){border-left:1px solid var(--line)}
#nTable tbody td:nth-child(2){border-left:1px solid var(--line)}
#nTable .rn{width:38px;min-width:38px;border-right:0;color:var(--muted);font-size:12px;text-align:center;position:relative;background:transparent}
#nTable td.rn span{display:block;padding-top:10px}
#nTable td.rn .rx{display:none;position:absolute;inset:4px;border:0;border-radius:7px;background:rgba(224,49,49,.12);color:#e03131;cursor:pointer;font-size:12px}
#nTable tr:hover td.rn .rx,#nTable td.rn .rx.armed{display:block}
#nTable td.rn .rx.armed{background:#e03131;color:#fff}
.hc{display:flex;align-items:center;gap:2px;padding:4px 4px 4px 10px;min-width:120px}
.hn{flex:1;font-weight:700;outline:none;padding:4px 0;min-width:30px;white-space:nowrap}
.hn:empty::before{content:"열 이름";opacity:.4}
.hb{width:28px;height:28px;border:0;background:none;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.hb:hover{background:rgba(127,127,127,.14);color:var(--ink)}
.hb.on{color:var(--accent)}
.hb.armed{background:#e03131;color:#fff}
.hb svg{width:16px;height:16px}
#nTable .addc{border:0;background:transparent;width:44px}
#nTable .addc .hb{margin:5px auto}
.c{min-height:38px;padding:9px 10px;outline:none;white-space:pre-wrap;word-break:break-word;min-width:120px;line-height:1.45;cursor:text}
.c:focus{box-shadow:inset 0 0 0 2px var(--accent);border-radius:2px;background:var(--panel)}
.c.cover:not(:focus){color:transparent;background:repeating-linear-gradient(-45deg,var(--line) 0 6px,transparent 6px 12px);cursor:pointer;user-select:none}
.c.cover:not(:focus) *{visibility:hidden}
.trow{display:flex;gap:6px;align-items:center;padding:4px 14px 10px;flex-wrap:wrap}
.trow .tip{font-size:12px;color:var(--muted);margin-left:4px}
/* 템플릿(메모) 화면 */
#notes{position:fixed;inset:0;background:var(--bg);z-index:25;display:none}
#notes.show{display:flex}
#notes .nlist{width:320px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#notes .nedit{flex:1;display:flex;flex-direction:column;min-width:0}
#notes header{display:flex;align-items:center;gap:6px;padding:10px 10px 8px}
#notes h2{margin:0 0 0 2px;font-size:17px;flex:1}
#nSearch{margin:0 12px 8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
#nItems{flex:1;overflow-y:auto;padding:0 8px 20px}
.nitem{padding:10px 12px;border-radius:10px;cursor:pointer}
.nitem:hover{background:rgba(127,127,127,.09)}
.nitem.on{background:rgba(59,108,246,.12)}
.nitem .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nempty{color:var(--muted);font-size:13px;padding:20px 12px;line-height:1.6}
#nTitle{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:19px;font-weight:700;color:var(--ink);outline:none;padding:6px 4px}
#nSaved{font-size:11px;color:var(--muted);white-space:nowrap;padding-right:6px}
#nBody{flex:1;border:0;outline:none;resize:none;background:none;color:var(--ink);font:15px/1.7 "Noto Sans KR",system-ui,sans-serif;padding:6px 18px 18px}
.nactions{display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.nactions .grow{flex:1}
#nBlank{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:30px;line-height:1.7}
#notes:not(.editing) .nedit>*:not(#nBlank){display:none}
#notes.editing #nBlank{display:none}
#nBack{display:none}
@media (max-width:700px){
  #notes .nlist{width:100%;border-right:0}
  #notes.editing .nlist{display:none}
  #notes:not(.editing) .nedit{display:none}
  #nBack{display:grid}
}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);max-width:calc(100vw - 32px);text-align:center;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:.94}
</style>
</head>
<body>

<div id="stage"><div id="world"><svg id="edges"></svg></div></div>

<div id="top">
  <div class="pill"><button class="ib" id="btnSide" title="마인드맵 목록"></button><button class="ib" id="btnNotes" title="템플릿 · 메모"></button></div>
  <div class="pill" id="titlebox" title="마인드맵 목록 열기">
    <div class="txt"><div id="mapTitle">마인드맵</div><div id="status">이 기기에 저장</div></div>
  </div>
  <div class="spacer"></div>
  <div class="pill">
    <button class="ib" id="btnSticky" title="포스트잇 붙이기 (노드를 선택한 상태면 그 노드에 붙어요)"></button>
    <button class="ib" id="btnUndo" title="실행 취소 (Ctrl+Z)"></button>
    <button class="ib" id="btnRedo" title="다시 실행 (Ctrl+Shift+Z)"></button>
    <button class="ib" id="btnFit" title="화면에 맞추기"></button>
    <button class="ib" id="btnMore" title="더보기"></button>
  </div>
</div>

<div class="pill" id="menu"></div>

<div class="pill" id="bar">
  <button id="bChild"></button>
  <button id="bSib"></button>
  <button id="bEdit"></button>
  <button id="bLink"></button>
  <button id="bColor"></button>
  <button id="bFold"></button>
  <button id="bReset"></button>
  <button id="bDel" class="danger"></button>
</div>
<div class="pill" id="lbar" style="display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);gap:2px;z-index:10">
  <button id="lLabel"></button>
  <button id="lFlip"></button>
  <button id="lDel" class="danger"></button>
</div>
<div class="pill" id="sbar" style="display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);gap:2px;z-index:10">
  <button id="sEdit"></button>
  <button id="sLink"></button>
  <button id="sColor"></button>
  <button id="sDetach"></button>
  <button id="sDel" class="danger"></button>
</div>
<div id="hint"><span>연결할 노드를 탭하세요</span><button id="hintCancel">취소</button></div>
<div class="pill" id="colors"></div>

<div id="scrim"></div>
<aside id="side">
  <header><h2>내 마인드맵</h2><button class="ib" id="btnSideClose" title="닫기"></button></header>
  <div class="actions">
    <button class="btn primary" id="btnNew">＋ 새 마인드맵</button>
    <button class="btn" id="btnImportText">텍스트로 만들기</button>
    <button class="btn" id="btnBackup">전체 백업</button>
    <button class="btn" id="btnImportJson">파일 가져오기</button>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
  </div>
  <div id="list"></div>
</aside>

<div id="notes">
  <div class="nlist">
    <header><button class="ib" id="nClose" title="마인드맵으로 돌아가기"></button><h2>템플릿 · 메모</h2><button class="btn primary" id="nNew">＋ 글</button><button class="btn primary" id="nNewTable">＋ 표</button></header>
    <input id="nSearch" type="search" placeholder="검색">
    <div id="nItems"></div>
  </div>
  <div class="nedit">
    <div id="nBlank">왼쪽에서 고르거나<br>“＋ 글” 또는 “＋ 표”를 눌러 시작하세요.</div>
    <header><button class="ib" id="nBack" title="목록"></button><input id="nTitle" placeholder="제목" maxlength="120"><span id="nSaved"></span></header>
    <textarea id="nBody" placeholder="자유롭게 적어 두세요.&#10;&#10;들여쓰기나 “- ” 목록으로 쓰면 아래 버튼으로 바로 마인드맵을 만들 수 있어요.&#10;예)&#10;회의 정리&#10;  안건&#10;  결정 사항&#10;  할 일"></textarea>
    <div id="nTableWrap">
      <div class="tscroll"><table id="nTable"></table></div>
      <div class="trow">
        <button class="btn" id="tAddRow">＋ 행 추가</button>
        <button class="btn" id="tShuffle">순서 섞기</button>

<script>
/* =========================================================
   마인드맵 — 단일 파일 앱
   데이터 구조:
     map  = { id, updatedAt, layout:'both'|'right', root }

const PALETTE = ['#e8590c','#2f9e44','#1971c2','#ae3ec9','#f08c00','#0c8599','#e64980','#5c7cfa'];

const $ = s => document.querySelector(s);

/* ---------- 아이콘 ---------- */
const P = {

  more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',

  fold:'<path d="m7 20 5-5 5 5M7 4l5 5 5-5"/>',

  side:'<path d="M4 12h16M4 12l6-6M4 12l6 6"/>',
  layout:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/>',
  text:'<path d="M4 6h16M4 12h10M4 18h13"/>',
  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  tag:'<path d="M12 2H2v10l9.3 9.3a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4Z"/><circle cx="7" cy="7" r="1.5"/>',
  flip:'<path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>',
  note:'<path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M15 3v5h5M8 13h8M8 17h5"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  sticky:'<path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  unpin:'<path d="M12 17v5M9 10.8V5h6v5.8l2 3.2H7Z"/><path d="M2 2l20 20"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M9.9 4.2A10 10 0 0 1 12 4c6.5 0 10 8 10 8a17 17 0 0 1-2.2 3.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M2 2l20 20"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  expand:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
  shrink:'<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* ---------- 상태 ---------- */
let maps = {};          // id -> map
let currentId = null;
let sel = null;         // 선택된 노드 id
let selLink = null;     // 선택된 관계선 id
let linkFrom = null;    // 관계선 만드는 중: 출발 노드 id
let selSticky = null;   // 선택된 포스트잇 id
let editingSticky = null, stickyInfo = null;
let sEls = {};
const STICKY = ['#ffe58a', '#ffc9d6', '#c8efbf', '#c6dfff', '#e2d3ff', '#ffd6a5'];
let editing = null;     // 편집 중인 노드 id
let editInfo = null;
let view = { x: 0, y: 0, s: 1 };
let undoStack = [], redoStack = [];

const cur = () => maps[currentId];
const links = () => (cur().links || (cur().links = []));
const stickies = () => (cur().stickies || (cur().stickies = []));

/* ---------- 트리 유틸 ---------- */
function find(id, node = cur().root, parent = null) {
  if (node.id === id) return { node, parent };
  for (const c of node.children) { const r = find(id, c, node); if (r) return r; }
  return null;
}

}
function countNodes(n) { return 1 + n.children.reduce((a, c) => a + countNodes(c), 0); }
const node = (text = '') => ({ id: uid(), text, children: [] });

function blankMap(title = '중심 주제') {
  return { id: uid(), updatedAt: Date.now(), layout: 'both', root: node(title), links: [], stickies: [] };
}
function sampleMap() {
  const m = blankMap('나의 마인드맵');
  const mk = (t, kids = []) => ({ ...node(t), children: kids.map(k => typeof k === 'string' ? node(k) : k) });
  m.root.children = [
    mk('사용법', ['탭/클릭 → 선택', '한 번 더 탭 → 글자 편집', '아래 툴바로 주제 추가', '노드를 끌어 빈 곳에 놓으면 위치 이동']),
    mk('아이디어', ['떠오르는 대로 적기']),
    mk('할 일', ['오늘', '이번 주']),
    mk('키보드', ['Tab: 하위 주제', 'Enter: 같은 단계', 'Delete: 삭제', '방향키: 이동']),
  ];
  return m;
}

/* ---------- 변경 & 실행취소 ---------- */
function snapshot() {
  undoStack.push(stateJson());
  if (undoStack.length > 150) undoStack.shift();
  redoStack = [];
}
function changed() {
  cur().updatedAt = Date.now();
  scheduleSave(cur().id);
  render();
}
function stateJson() { return JSON.stringify({ root: cur().root, links: links(), stickies: stickies() }); }
function applyState(st) { cur().root = st.root; cur().links = st.links || []; cur().stickies = st.stickies || []; }
function restore(json) {
  applyState(JSON.parse(json));
  if (selSticky && !stickies().some(x => x.id === selSticky)) selSticky = null;
  if (sel && !find(sel)) sel = null;
  if (selLink && !links().some(l => l.id === selLink)) selLink = null;
  cur().updatedAt = Date.now(); scheduleSave(cur().id); render();
}
function undo() { if (editing) commitEdit(); if (!undoStack.length) return; redoStack.push(stateJson()); restore(undoStack.pop()); }
function redo() { if (editing) commitEdit(); if (!redoStack.length) return; undoStack.push(stateJson()); restore(redoStack.pop()); }

/* ---------- 노드 조작 ---------- */
function addChild(pid) {
  const r = find(pid); if (!r) return;
  snapshot();
  const n = node(); r.node.collapsed = false; r.node.children.push(n);
  sel = n.id; changed(); startEdit(n.id, { isNew: true });
}
function addSibling(id) {
  const r = find(id); if (!r) return;
  if (!r.parent) return addChild(id);
  snapshot();
  const n = node(); r.parent.children.splice(r.parent.children.indexOf(r.node) + 1, 0, n);
  sel = n.id; changed(); startEdit(n.id, { isNew: true });
}
function removeNode(id) {
  const r = find(id); if (!r) return;
  if (!r.parent) { toast('중심 주제는 삭제할 수 없어요'); return; }
  snapshot();
  for (const st of stickies()) if (st.anchor && isInSubtree(id, st.anchor)) {
    const w = stickyPos(st) || (pos[id] ? { x: pos[id].x, y: pos[id].y } : { x: 0, y: 0 });
    st.x = w.x; st.y = w.y; delete st.anchor;
  }
  const sibs = r.parent.children, i = sibs.indexOf(r.node);
  sibs.splice(i, 1);
  cur().links = links().filter(l => itemExists(l.from) && itemExists(l.to));
  sel = (sibs[i] || sibs[i - 1] || r.parent).id;
  changed();
}
function toggleFold(id) {
  const r = find(id); if (!r || !r.node.children.length) return;
  snapshot(); r.node.collapsed = !r.node.collapsed; changed();
}
function setColor(id, c) {
  const r = find(id); if (!r) return;
  snapshot(); if (c) r.node.color = c; else delete r.node.color; changed();
}
function moveNode(id, targetId) {
  if (isInSubtree(id, targetId)) return;
  const r = find(id); if (!r || !r.parent || r.parent.id === targetId) return;
  snapshot();
  r.parent.children.splice(r.parent.children.indexOf(r.node), 1);
  delete r.node.off; delete r.node.side;
  const t = find(targetId).node; t.collapsed = false; t.children.push(r.node);
  sel = id; changed();
}
/* ---------- 관계선(연관 노드) ---------- */
function startLink(id) {
  if (editing) commitEdit();
  if (editingSticky) commitStickyEdit();
  linkFrom = id; selLink = null; selSticky = null;
  $('#hint').classList.add('show'); applySel();
}
function cancelLink() {
  linkFrom = null; $('#hint').classList.remove('show');
  const t = $('#tmpLink'); if (t) t.remove();
  applySel();
}
function finishLink(to) {
  const from = linkFrom; cancelLink();
  if (!to || to === from) return;
  if (links().some(l => (l.from === from && l.to === to) || (l.from === to && l.to === from))) { toast('이미 연결돼 있어요'); return; }
  snapshot();
  const l = { id: uid(), from, to, label: '' };
  links().push(l); sel = null; selSticky = null; selLink = l.id; changed();
  toast('연결했어요');
}
function selectLink(id) { sel = null; selLink = id; relayout(); applySel(); }
function removeLink(id) { snapshot(); cur().links = links().filter(l => l.id !== id); selLink = null; changed(); }
function flipLink(id) { const l = links().find(x => x.id === id); if (!l) return; snapshot(); [l.from, l.to] = [l.to, l.from]; changed(); }
function editLinkLabel(id) {
  const l = links().find(x => x.id === id); if (!l) return;
  openModal(`<h3>관계선 이름</h3><p>두 주제가 어떤 관계인지 짧게 적어 주세요. (예: 원인, 참고, 반대 의견) 비우면 이름이 사라져요.</p>
    <input id="mInput" maxlength="40" style="width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)">
    <div class="row"><button class="btn" id="mClose">취소</button><button class="btn primary" id="mOk">저장</button></div>`);
  const inp = $('#mInput'); inp.value = l.label || '';
  const ok = () => { const v = inp.value.trim(); closeModal(); if (v !== (l.label || '')) { snapshot(); l.label = v; changed(); } };
  $('#mOk').onclick = ok; $('#mClose').onclick = closeModal;
  inp.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); ok(); } };
  setTimeout(() => { inp.focus(); inp.select(); }, 50);
}
/* 접힌 가지 안에 숨은 노드는 화면에 보이는 가장 가까운 조상으로 대신 연결 */
function shownId(id) {
  const path = [];
  (function w(n) { path.push(n); if (n.id === id) return true; for (const c of n.children) if (w(c)) return true; path.pop(); return false; })(cur().root);
  for (const n of path) if (n.collapsed && n.id !== id) return n.id;
  return path.length ? id : null;
}
/* 관계선의 끝: 노드 또는 포스트잇 → 화면상 중심과 크기 */
function linkEnd(id) {
  if (sEls[id]) {
    const el = sEls[id]; if (el.style.display === 'none') return null;
    const w = el.offsetWidth, h = el.offsetHeight;
    return { key: id, p: { x: parseFloat(el.style.left) + w / 2, y: parseFloat(el.style.top) + h / 2 }, s: { w, h } };
  }
  const k = shownId(id);
  if (!k || !pos[k]) return null;
  return { key: k, p: pos[k], s: size[k] };
}
const itemExists = id => !!(find(id) || stickies().some(x => x.id === id));
function itemName(id) {
  const r = find(id); if (r) return r.node.text.replace(/\n+/g, ' ');
  const st = stickies().find(x => x.id === id);
  return st ? '포스트잇: ' + (st.text.replace(/\n+/g, ' ').slice(0, 30) || '(빈 메모)') : '';
}
function edgePt(P, s, T) {
  const dx = T.x - P.x, dy = T.y - P.y;
  const k = 1 / Math.max(Math.abs(dx) / (s.w / 2 + 6), Math.abs(dy) / (s.h / 2 + 6), 1e-6);
  return { x: P.x + dx * k, y: P.y + dy * k };
}

/* ---------- 노드 위치 조정 ---------- */
function resetPos(id) { const r = find(id); if (!r || !(r.node.off || r.node.side)) return; snapshot(); delete r.node.off; delete r.node.side; changed(); }
function resetAllPos() {
  snapshot(); (function w(n) { delete n.off; delete n.side; n.children.forEach(w); })(cur().root); changed(); fit();
}

/* ---------- 포스트잇 ----------
   sticky = { id, text, color, x, y, anchor? }
   anchor가 있으면 x,y는 그 노드 중심에서의 거리(노드를 따라 움직임), 없으면 캔버스 좌표 */
function stickyPos(st) {
  if (!st.anchor) return { x: st.x, y: st.y };
  const a = shownId(st.anchor);
  if (!a || a !== st.anchor || !pos[a]) return null;     // 접힌 가지 안 → 숨김
  return { x: pos[a].x + st.x, y: pos[a].y + st.y };
}
function besideNode(id) {
  const p = pos[id], sz = size[id];
  if (!p) return { x: 30, y: -100 };
  return { x: -85 + (p.side < 0 ? -30 : 30), y: -sz.h / 2 - 104 };     // 노드 바로 위 (하위 주제를 가리지 않게)
}
function addSticky() {
  if (editing) commitEdit(); if (editingSticky) commitStickyEdit(); if (linkFrom) cancelLink();
  const anchor = sel && find(sel) ? sel : null;
  snapshot();
  const st = { id: uid(), text: '', color: STICKY[0] };
  if (anchor) { st.anchor = anchor; Object.assign(st, besideNode(anchor)); }
  else {
    const n = stickies().length % 5;
    st.x = (innerWidth / 2 - view.x) / view.s - 85 + n * 18;
    st.y = (innerHeight / 2 - view.y) / view.s - 60 + n * 18;
  }
  stickies().push(st);
  sel = null; selSticky = st.id; changed();
  startStickyEdit(st.id, { isNew: true });
}
function selectSticky(id) {
  const had = selLink; sel = null; selLink = null; selSticky = id;
  if (had) relayout(); applySel();
}
function removeSticky(id) { snapshot(); cur().stickies = stickies().filter(x => x.id !== id); cur().links = links().filter(l => l.from !== id && l.to !== id); selSticky = null; changed(); }
function detachSticky(id) {
  const st = stickies().find(x => x.id === id); if (!st || !st.anchor) return;
  const w = stickyPos(st); snapshot();
  if (w) { st.x = w.x; st.y = w.y; } delete st.anchor; changed(); toast('노드에서 떼어 냈어요');
}
function setStickyColor(id, c) { const st = stickies().find(x => x.id === id); if (!st) return; snapshot(); st.color = c; changed(); }
function startStickyEdit(id, opt = {}) {
  if (editing) commitEdit(); if (editingSticky) commitStickyEdit();
  const el = sEls[id], st = stickies().find(x => x.id === id); if (!el || !st) return;
  editingSticky = id; stickyInfo = { orig: st.text, isNew: !!opt.isNew };
  selSticky = id; applySel();
  const t = el.querySelector('.st');
  t.setAttribute('contenteditable', 'plaintext-only');
  if (t.contentEditable !== 'plaintext-only') t.setAttribute('contenteditable', 'true');
  t.focus();
  const rg = document.createRange(); rg.selectNodeContents(t); rg.collapse(false);
  const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg);
  t.onkeydown = e => { e.stopPropagation(); if (e.key === 'Escape') { e.preventDefault(); commitStickyEdit(); } };
  t.onblur = () => { if (editingSticky === id) commitStickyEdit(); };
}
function commitStickyEdit(cancel = false) {
  if (!editingSticky) return;
  const id = editingSticky, info = stickyInfo, el = sEls[id];
  editingSticky = null; stickyInfo = null;
  const t = el && el.querySelector('.st');
  const text = t ? (t.innerText || '').replace(/ /g, ' ').replace(/\n{3,}/g, '\n\n').trim() : '';
  const st = stickies().find(x => x.id === id);
  if (info.isNew && (cancel || !text)) {                 // 빈 새 포스트잇은 버림
    applyState(JSON.parse(undoStack.pop())); redoStack = []; selSticky = null;
    cur().updatedAt = Date.now(); scheduleSave(cur().id); render(); return;
  }
  if (cancel || !st || text === info.orig) { render(); return; }
  if (!info.isNew) snapshot();
  st.text = text; changed();
}

function setAllFold(collapsed) {
  snapshot();
  (function walk(n, d) { if (d > 0 && n.children.length) n.collapsed = collapsed; n.children.forEach(c => walk(c, d + 1)); })(cur().root, 0);
  changed(); fit();
}

/* =========================================================
   렌더링
   ========================================================= */
const world = $('#world'), edgesSvg = $('#edges');
const nodeBg = () => getComputedStyle(document.documentElement).getPropertyValue('--node').trim() || '#ffffff';
function mixHex(a, b, t) {               // a를 t 비율로 b에 섞은 색
  const h = x => { x = x.replace('#', ''); if (x.length === 3) x = [...x].map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16)); };
  const A = h(a), B = h(b);
  return '#' + A.map((v, i) => Math.round(v * t + B[i] * (1 - t)).toString(16).padStart(2, '0')).join('');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!editing) render(); });

function render() {
  if (!cur()) return;
  world.querySelectorAll('.node').forEach(e => e.remove());
  els = {};
  const meta = {};
  (function walk(n, depth, inherited) {
    const color = depth === 0 ? (n.color || null) : (n.color || inherited);
    const el = document.createElement('div');
    el.className = 'node' + (depth === 0 ? ' root' : depth === 1 ? ' l1' : '');
    el.dataset.id = n.id;

function nav(key) {
  const p = pos[sel]; if (!p) return;
  let best = null, bs = Infinity;
  for (const id in pos) {
    if (id === sel) continue;
    const q = pos[id], dx = q.x - p.x, dy = q.y - p.y;
    const [main, cross] = key === 'ArrowRight' ? [dx, dy] : key === 'ArrowLeft' ? [-dx, dy] : key === 'ArrowDown' ? [dy, dx] : [-dy, dx];
    if (main <= 4) continue;
    const sc = main + Math.abs(cross) * 2.5;
    if (sc < bs) { bs = sc; best = id; }
  }
  if (best) { sel = best; applySel(); ensureVisible(best); }
}
document.addEventListener('keydown', e => {
  if (editing || editingSticky) return;

  if ($('#modal').classList.contains('show')) { if (e.key === 'Escape') closeModal(); return; }
  if ($('#notes').classList.contains('show')) { if (e.key === 'Escape') closeNotes(); return; }
  const mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (k === 'Escape') { if (linkFrom) { cancelLink(); return; } hidePopovers(); closeSide(); sel = null; selSticky = null; const had = selLink; selLink = null; if (had) relayout(); applySel(); return; }
  if (selSticky) {

    if (['Enter', 'Tab', ' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) { e.preventDefault(); sel = cur().root.id; applySel(); }
    return;
  }
  if (k === 'Tab') { e.preventDefault(); addChild(sel); }
  else if (k === 'Enter') { e.preventDefault(); addSibling(sel); }
  else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); removeNode(sel); }

function toOutline(n, depth = 0) {
  const line = (depth === 0 ? '# ' : '  '.repeat(depth - 1) + '- ') + n.text.replace(/\n+/g, ' ');
  return [line, ...n.children.map(c => toOutline(c, depth + 1))].join('\n');

function parseOutline(text, title) {

  const vroot = { lvl: -Infinity, node: node(title || '가져온 마인드맵') };
  const stack = [vroot]; let headBase = null;
  for (const raw of lines) {
    const m = raw.match(/^([ \t]*)(#{1,6}\s+)?(?:(?:[-*+•]|\d+[.)])\s+)?(.*)$/);
    const indent = m[1].replace(/\t/g, '    ').length;
    let lvl;
    if (m[2]) { lvl = (m[2].trim().length - 1) * 1000; headBase = lvl; }
    else lvl = headBase === null ? indent : headBase + 500 + indent;
    const txt = m[3].trim(); if (!txt) continue;
    while (stack.length > 1 && stack[stack.length - 1].lvl >= lvl) stack.pop();
    const n = node(txt); stack[stack.length - 1].node.children.push(n);
    stack.push({ lvl, node: n });
  }
  const kids = vroot.node.children;
  return kids.length === 1 ? kids[0] : vroot.node;
}

async function offerDownload(filename, data) {
  try {
    const dl = window.claude && claude.use && await claude.use('downloads');
    if (dl) { await dl.save({ filename, data }); return true; }
  } catch (e) {
    if (e && e.code === 'declined') return true;
  }
  try {                                    // 독립 웹앱: 브라우저 다운로드
    const ext = filename.split('.').pop();
    const type = { json: 'application/json', svg: 'image/svg+xml', md: 'text/markdown' }[ext] || 'text/plain';
    const url = URL.createObjectURL(new Blob([data], { type: type + ';charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return !(window.claude && claude.use);  // Claude 안에서는 막히므로 실패로 처리
  } catch { return false; }
}

/* ---------- 표 편집 ---------- */
let tArm = null;
function armBtn(btn, key) {         // 한 번 더 눌러야 실행 (실수 방지)
  if (tArm && tArm.key === key) { clearTimeout(tArm.t); tArm = null; return true; }
  if (tArm) { clearTimeout(tArm.t); tArm.btn.classList.remove('armed'); }
  btn.classList.add('armed'); toast('한 번 더 누르면 삭제돼요');
  tArm = { key, btn, t: setTimeout(() => { btn.classList.remove('armed'); tArm = null; }, 2500) };
  return false;
}
function renderTable(focus) {
  const n = notes[curNote]; if (!isTable(n)) return;
  const t = n.table, tb = $('#nTable');
  t.hidden = t.cols.map((_, i) => !!(t.hidden && t.hidden[i]));
  let h = '<thead><tr><th class="rn"></th>';
  t.cols.forEach((c, i) => {
    h += `<th><div class="hc"><div class="hn" contenteditable="plaintext-only" data-c="${i}">${esc(c)}</div>`
       + `<button class="hb eye${t.hidden[i] ? ' on' : ''}" data-c="${i}" title="${t.hidden[i] ? '보이기' : '가리기 (외우기용)'}">${icon(t.hidden[i] ? 'eyeoff' : 'eye')}</button>`
       + `<button class="hb cx" data-c="${i}" title="열 삭제">${icon('x')}</button></div></th>`;
  });
  h += `<th class="addc"><button class="hb" id="tAddCol" title="열 추가">${icon('plus')}</button></th></tr></thead><tbody>`;
  t.rows.forEach((r, ri) => {
    h += `<tr><td class="rn"><span>${ri + 1}</span><button class="rx" data-r="${ri}" title="행 삭제">✕</button></td>`;
    t.cols.forEach((_, ci) => { h += `<td><div class="c${t.hidden[ci] ? ' cover' : ''}" contenteditable="plaintext-only" data-r="${ri}" data-c="${ci}">${esc(r[ci] || '')}</div></td>`; });
    h += '<td class="addc"></td></tr>';
  });
  tb.innerHTML = h + '</tbody>';
  tb.querySelectorAll('[contenteditable]').forEach(el => { if (el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable', 'true'); });
  if (focus) { const el = tb.querySelector(`.c[data-r="${focus[0]}"][data-c="${focus[1]}"]`); if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); } }
}
const cellText = el => (el.innerText || '').replace(/\u00a0/g, ' ').replace(/\n$/, '');
$('#nTable').addEventListener('input', e => {
  const n = notes[curNote]; if (!isTable(n)) return;
  const el = e.target;
  if (el.classList.contains('c')) n.table.rows[+el.dataset.r][+el.dataset.c] = cellText(el);
  else if (el.classList.contains('hn')) n.table.cols[+el.dataset.c] = cellText(el).replace(/\n/g, ' ');
  touchNote();
});
$('#nTable').addEventListener('keydown', e => {
  const el = e.target, n = notes[curNote];
  if (!isTable(n) || e.isComposing || e.keyCode === 229) return;
  if (el.classList.contains('hn') && e.key === 'Enter') { e.preventDefault(); const c = $(`#nTable .c[data-r="0"][data-c="${el.dataset.c}"]`); if (c) c.focus(); return; }
  if (!el.classList.contains('c')) return;
  const r = +el.dataset.r, c = +el.dataset.c;
  if (e.key === 'Enter' && !e.shiftKey) {             // 아래 칸으로 (마지막 줄이면 새 행)
    e.preventDefault();
    if (r === n.table.rows.length - 1) { n.table.rows.push(n.table.cols.map(() => '')); touchNote(); renderTable([r + 1, c]); }
    else $(`#nTable .c[data-r="${r + 1}"][data-c="${c}"]`).focus();
  } else if (e.key === 'ArrowUp' && r > 0 && atEdge(el, true)) { e.preventDefault(); $(`#nTable .c[data-r="${r - 1}"][data-c="${c}"]`).focus(); }
  else if (e.key === 'ArrowDown' && r < n.table.rows.length - 1 && atEdge(el, false)) { e.preventDefault(); $(`#nTable .c[data-r="${r + 1}"][data-c="${c}"]`).focus(); }
});
function atEdge(el, start) {
  const s = getSelection(); if (!s.rangeCount) return true;
  const rg = s.getRangeAt(0), all = document.createRange(); all.selectNodeContents(el);
  return start ? rg.compareBoundaryPoints(Range.START_TO_START, all) <= 0 || !el.textContent
               : rg.compareBoundaryPoints(Range.END_TO_END, all) >= 0 || !el.textContent;
}
// 엑셀·시트에서 복사한 표 붙여 넣기 → 여러 칸에 나눠 넣기
$('#nTable').addEventListener('paste', e => {
  const el = e.target, n = notes[curNote];
  if (!isTable(n) || !el.classList || !el.classList.contains('c')) return;
  const txt = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
  if (!/[\t\n]/.test(txt.replace(/\n+$/, ''))) return;   // 한 칸짜리는 그냥 붙여 넣기
  e.preventDefault();
  const grid = txt.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(l => l.split('\t'));
  const t = n.table, r0 = +el.dataset.r, c0 = +el.dataset.c;
  const needCols = c0 + Math.max(...grid.map(g => g.length));
  while (t.cols.length < needCols) { t.cols.push('열 ' + (t.cols.length + 1)); t.hidden.push(false); t.rows.forEach(r => r.push('')); }
  grid.forEach((g, i) => {
    const ri = r0 + i;
    while (t.rows.length <= ri) t.rows.push(t.cols.map(() => ''));
    g.forEach((v, j) => { t.rows[ri][c0 + j] = v.trim(); });
  });
  touchNote(); renderTable([r0 + grid.length - 1, c0]);
  toast(`${grid.length}줄을 붙여 넣었어요`);
});
$('#nTable').addEventListener('click', e => {
  const n = notes[curNote]; if (!isTable(n)) return;
  const t = n.table, b = e.target.closest('button'); if (!b) return;
  if (b.id === 'tAddCol') {
    t.cols.push(''); t.hidden.push(false); t.rows.forEach(r => r.push(''));
    touchNote(); renderTable();
    const hn = $(`#nTable .hn[data-c="${t.cols.length - 1}"]`); if (hn) hn.focus();
  } else if (b.classList.contains('eye')) {
    const i = +b.dataset.c; t.hidden[i] = !t.hidden[i]; touchNote(); renderTable();
  } else if (b.classList.contains('cx')) {
    const i = +b.dataset.c;
    if (t.cols.length <= 1) { toast('열이 하나는 있어야 해요'); return; }
    const hasData = t.rows.some(r => (r[i] || '').trim());
    if (hasData && !armBtn(b, 'c' + i)) return;
    t.cols.splice(i, 1); t.hidden.splice(i, 1); t.rows.forEach(r => r.splice(i, 1));
    touchNote(); renderTable();
  } else if (b.classList.contains('rx')) {
    const i = +b.dataset.r;
    if (t.rows[i].some(c => c.trim()) && !armBtn(b, 'r' + i)) return;
    t.rows.splice(i, 1); if (!t.rows.length) t.rows.push(t.cols.map(() => ''));
    touchNote(); renderTable();
  }
});
$('#tAddRow').onclick = () => {
  const n = notes[curNote]; if (!isTable(n)) return;
  n.table.rows.push(n.table.cols.map(() => '')); touchNote(); renderTable([n.table.rows.length - 1, 0]);
};
$('#tShuffle').onclick = () => {
  const n = notes[curNote]; if (!isTable(n)) return;
  const rows = n.table.rows;
  for (let i = rows.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rows[i], rows[j]] = [rows[j], rows[i]]; }
  touchNote(); renderTable(); toast('순서를 섞었어요');
};
$('#nSearch').addEventListener('input', renderNotes);

/* =========================================================
   저장: localStorage + claude db (기기 간 동기화)
   ========================================================= */
let cloud = null, tombstones = {};
const saveTimers = {}, writeChain = {};

function setStatus(s) {
  const el = $('#status'); el.className = s;
  el.textContent = { cloud: '저장됨 · 기기 간 동기화', local: '이 기기에 저장', saving: '저장 중…', error: '클라우드 저장 실패 · 이 기기에는 저장됨' }[s];
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ maps, currentId, tombstones, notes, noteTombs })); } catch {}
}
function scheduleSave(id) {
  saveLocal();
  if (!cloud) return;
  setStatus('saving');
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(() => { delete saveTimers[id]; pushMap(id); }, 900);
}
function chain(id, fn) {
  writeChain[id] = (writeChain[id] || Promise.resolve()).then(fn).catch(() => setStatus('error'));
  return writeChain[id];
}
function pushMap(id) {
  if (!cloud) return;
  return chain(id, async () => {
    const m = maps[id]; if (!m) return;
    await cloud.col.doc('m-' + id).set({ updatedAt: m.updatedAt, data: JSON.stringify(m) });
    if (!Object.keys(saveTimers).length) setStatus('cloud');
  });
}
function pushDelete(id, t) {
  if (!cloud) return;
  chain(id, () => cloud.col.doc('m-' + id).set({ updatedAt: t, deleted: true }));
}
function pushNote(id) {
  if (!cloud) { $('#nSaved').textContent = '이 기기에 저장됨'; return; }
  return chain('n-' + id, async () => {
    const n = notes[id]; if (!n || noteEmpty(n)) return;
    await cloud.col.doc('n-' + id).set({ updatedAt: n.updatedAt, data: JSON.stringify(n) });
    if (curNote === id && !noteTimer) $('#nSaved').textContent = '저장됨';
  });
}
function pushNoteDelete(id, t) {
  if (!cloud) return;
  chain('n-' + id, () => cloud.col.doc('n-' + id).set({ updatedAt: t, deleted: true }));
}
function flushSaves() { flushNoteSave(); for (const id in saveTimers) { clearTimeout(saveTimers[id]); delete saveTimers[id]; pushMap(id); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSaves(); });

async function initCloud() {
  try {
    if (!window.claude || !claude.use) return setStatus('local');
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const userId = user && await user.id();
    if (!db || !userId) return setStatus('local');
    const col = db.collection('data/users/' + userId);
    const snap = await Promise.race([col.get(), new Promise((_, rej) => setTimeout(() => rej('timeout'), 10000))]);
    const seen = new Set(); let curChanged = false, listChanged = false;
    for (const d of snap.docs) {
      if (!d.id.startsWith('m-')) continue;
      const id = d.id.slice(2), body = d.data() || {}; seen.add(id);
      const local = maps[id];
      if (body.deleted) {
        if (local && local.updatedAt <= body.updatedAt) { delete maps[id]; listChanged = true; if (id === currentId) curChanged = true; }
        tombstones[id] = body.updatedAt; continue;
      }
      if (tombstones[id] && tombstones[id] >= body.updatedAt) continue;
      try {
        const m = JSON.parse(body.data);
        if (!local || m.updatedAt > local.updatedAt) { maps[id] = m; listChanged = true; if (id === currentId) curChanged = true; }
      } catch {}
    }
    // 템플릿·메모 합치기
    const seenN = new Set(); let notesChanged = false;
    for (const d of snap.docs) {
      if (!d.id.startsWith('n-')) continue;
      const id = d.id.slice(2), body = d.data() || {}; seenN.add(id);
      const local = notes[id];
      if (body.deleted) {
        if (local && local.updatedAt <= body.updatedAt && id !== curNote) { delete notes[id]; notesChanged = true; }
        noteTombs[id] = body.updatedAt; continue;
      }
      if (noteTombs[id] && noteTombs[id] >= body.updatedAt) continue;
      try {
        const n = JSON.parse(body.data);
        if ((!local || n.updatedAt > local.updatedAt) && id !== curNote) { notes[id] = n; notesChanged = true; }
      } catch {}
    }
    cloud = { col };
    for (const id in notes) {
      const d = snap.docs.find(x => x.id === 'n-' + id);
      if (!d || (d.data().updatedAt || 0) < notes[id].updatedAt) pushNote(id);
    }
    for (const id in noteTombs) if (!seenN.has(id)) pushNoteDelete(id, noteTombs[id]);
    if (notesChanged) { saveLocal(); if ($('#notes').classList.contains('show')) renderNotes(); }
    // 이 기기에만 있거나 더 최신인 것 올리기
    for (const id in maps) {
      const d = snap.docs.find(x => x.id === 'm-' + id);
      if (!d || (d.data().updatedAt || 0) < maps[id].updatedAt) pushMap(id);
    }
    for (const id in tombstones) if (!seen.has(id)) pushDelete(id, tombstones[id]);
    if (!Object.keys(maps).length) { const m = sampleMap(); maps[m.id] = m; pushMap(m.id); }
    if (!maps[currentId]) { currentId = Object.values(maps).sort((a, b) => b.updatedAt - a.updatedAt)[0].id; curChanged = true; }
    if (listChanged) saveLocal();
    if (curChanged && !editing) { sel = null; undoStack = []; redoStack = []; render(); fit(); }
    if ($('#side').classList.contains('open')) renderList();
    setStatus('cloud');
  } catch (e) { cloud = null; setStatus('local'); }
}

/* =========================================================
   시작
   ========================================================= */
(function boot() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && s.maps) { maps = s.maps; currentId = s.currentId; tombstones = s.tombstones || {}; notes = s.notes || {}; noteTombs = s.noteTombs || {}; }
  } catch {}
  if (!Object.keys(maps).length) { const m = sampleMap(); maps[m.id] = m; currentId = m.id; saveLocal(); }
  if (!maps[currentId]) currentId = Object.values(maps).sort((a, b) => b.updatedAt - a.updatedAt)[0].id;
  setStatus('local');
  render(); fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!editing) { relayout(); fit(); } });
  addEventListener('resize', () => { if (!editing) updateBar(); });
  initCloud();
})();
</script>
